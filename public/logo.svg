<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 168" fill="none" role="img" aria-label="Chemical System Corporation">
  <title>Chemical System Corporation</title>
  <!-- Brand: red #FF0808 · blue #0B2FFF · black #000000 · transparent bg -->
  <g font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="56" font-weight="900" text-anchor="middle">
    <!-- Red C -->
    <rect x="46" y="12" width="12" height="40" fill="#FF0808"/>
    <text x="52" y="108" fill="#FF0808">C</text>
